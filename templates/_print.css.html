<style>
@font-face { font-family: "Montserrat"; font-weight: 400; src: url("/static/fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 600; src: url("/static/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 800; src: url("/static/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
:root { --ink:#15181c; --muted:#69737d; --cyan:#00aeef; --line:#e2e7eb; }
* { box-sizing: border-box; }
body { font-family: "Montserrat", Arial, sans-serif; color: var(--ink); margin: 0; background: #f4f7f9; }
.page { max-width: 820px; margin: 24px auto; background: #fff; padding: 44px 52px; border-radius: 14px; box-shadow: 0 6px 24px rgba(16,32,44,.08); }
.brand { font-weight: 800; font-size: 14px; } .brand span { color: var(--cyan); }
h1 { font-size: 26px; font-weight: 800; margin: 14px 0 4px; line-height: 1.2; }
h1::after { content: ""; display: block; width: 56px; height: 5px; background: var(--cyan); margin-top: 10px; }
h2 { font-size: 16px; font-weight: 800; margin: 28px 0 6px; }
.k { color: #0084b8; font-weight: 800; font-size: 12.5px; }
p, li { font-size: 13px; line-height: 1.55; }
.muted { color: var(--muted); font-size: 12px; }
.action { background: #e9f7fd; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 2px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; background: var(--cyan); padding: 3px 8px; border-radius: 999px; margin: 0 4px 4px 0; }
.bar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 6px; }
.bar button, .bar a { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; color: var(--ink); text-decoration: none; }
@media print { body { background: #fff; } .page { box-shadow: none; margin: 0; max-width: none; padding: 0; } .bar { display: none; } h2 { break-after: avoid; } tr { break-inside: avoid; } }
</style>
